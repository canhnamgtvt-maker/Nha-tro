name: Điều khiển Bot Cá Nhân Đa Năng

on:
  schedule:
    # Tự động kiểm tra lịch vào đầu mỗi giờ từ 6h sáng đến 21h tối (giờ VN)
    - cron: '12 23 * * *'
    - cron: '12 0-14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Chế độ: scan_id (Quét Chat ID) | send_now (Nhắn ngay) | schedule (Chạy lịch)'
        required: true
        default: 'scan_id'
      target_user:
        description: 'Tên trong danh bạ (hoặc mã Chat ID) nếu chọn send_now'
        required: false
        default: 'nguoi_rieng_1'
      custom_msg:
        description: 'Nội dung tin nhắn muốn gửi ngay (nếu chọn send_now)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Tải dữ liệu
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Thực thi lệnh Bot
        env:
          ZALO_BOT_TOKEN: ${{ secrets.ZALO_BOT_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'schedule' }}
          TARGET_USER: ${{ github.event.inputs.target_user || '' }}
          CUSTOM_MSG: ${{ github.event.inputs.custom_msg || '' }}
        run: node bot.js

      - name: Lưu danh bạ và khóa chống gửi trùng
        run: |
          git config --global user.name "Personal Bot"
          git config --global user.email "actions@github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Cập nhật trạng thái Bot" && git pull --rebase origin main && git push)
